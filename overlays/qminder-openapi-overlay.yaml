overlay: 1.0.0
info:
  title: API Evangelist enhancements for Qminder API
  version: 1.0.0
extends: openapi/qminder-openapi-original.json
actions:
  - target: $.info
    update:
      x-apievangelist-enriched: '2026-07-20'
      x-api-style: rest
      x-companion-apis:
        - graphql
        - webhooks
      x-rate-limit: 5 requests/second per API key (token bucket, burst 40)
      x-error-envelope: statusCode/message/developerMessage (not RFC 9457)
      x-sdk: qminder-api (npm, official)
      x-webhook-signature: X-Qminder-Signature (HMAC-SHA256)
  - target: $.info
    update:
      x-compliance:
        - SOC 2 Type II
        - HIPAA (BAA)
        - TX-RAMP Level 2
        - GDPR
