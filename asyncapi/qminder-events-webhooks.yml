events:
  - name: location_created
    resource: location
    description: A location is added to the Qminder account.
  - name: location_changed
    resource: location
    description: A location's settings have changed.
  - name: line_changed
    resource: line
    description: A line's settings have changed.
  - name: ticket_created
    resource: ticket
    description: A ticket is added to a queue.
  - name: ticket_called
    resource: ticket
    description: A ticket is called for service.
  - name: ticket_recalled
    resource: ticket
    description: A ticket is re-called.
  - name: ticket_changed
