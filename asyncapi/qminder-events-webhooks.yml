    description: A ticket's data is changed.
  - name: ticket_served
    resource: ticket
    description: A ticket is marked as served.
graphql_subscriptions:
  note: >-
    Qminder also exposes real-time GraphQL subscriptions (e.g. createdTickets,
    calledTickets, servedTickets, changedTickets, appointmentChanged) as a
    streaming alternative to webhooks.
