description: >-
  Qminder is a cloud-based queue management and appointment scheduling platform
  that helps retail, healthcare, government, and education organizations manage
  visitor flow, virtual queues, and service points across physical locations.
  Its developer platform exposes a REST API and a GraphQL API (with real-time
  subscriptions) at api.qminder.com for creating tickets, calling and serving
  visitors, scheduling appointments, managing locations, lines, desks, users,
  and custom input fields, plus webhooks for ticket, line, and location events.
  An official JavaScript/TypeScript SDK (qminder-api) is published to npm.
